## ELF .so 插件工程（smoke 测试插件）
## 组件由根 CMakeLists 的 EXTRA_COMPONENT_DIRS 复用主工程 managed_components 提供
## （elf_loader / cmake_utilities / lvgl / esp_lvgl_adapter），无需组件管理器下载。
## 插件 include 的主固件头文件（batteryManager.hpp 等）已瘦身：只依赖 IDF 自带组件
## （esp_adc/esp_driver_gpio），不依赖第三方 managed_components（见 REQUIRES）。
dependencies:
  idf:
    version: '>=4.1.0'
