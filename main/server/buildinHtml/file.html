<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>文件管理</title>
</head>

<body>
	<div>
		<input type="file" id="fileUploadInput" />
		<br />
		<button id="fileUploadButton" multiple>上传至此处</button>
		<button id="refresh" multiple>刷新</button>
	</div>
	<progress id="uploadProgress" value="0" max="100" style="display:none;width:240px;max-width:70%"></progress>
	<p id="uploadStatus" style="margin:4px 0 0 0"></p>
	<br />
	<div>
		<input type="text" id="newFloorNameInput" />
		<br />
		<button id="newFloorButton" multiple>新建文件夹</button>
	</div>
	<p id="space">剩余空间/总空间:0/0(100%)</p>
	<div id="explorer">
		正在加载...
	</div>
</body>

<script>
	let fileUploadElement = document.getElementById("fileUploadInput");
	let newFloorElement = document.getElementById("newFloorNameInput");
	let fileExplorerElement = document.getElementById("explorer");
	let spaceElement = document.getElementById("space");
	let uploadButton = document.getElementById("fileUploadButton");
	let uploadProgressElement = document.getElementById("uploadProgress");
	let uploadStatusElement = document.getElementById("uploadStatus");

	let place = "/";
	const splitChar = '\n';

	function cd(path) {
		if (path[path.length - 1] != '/') return;
		if (path == '../') {
			var i = place.length;
			while (i >= 0) {
				if (place[i] == '/') break;
				else i--;
			}
			i--;
			while (i >= 0) {
				if (place[i] == '/') break;
				else i--;
			}
			i++;
			if (i <= 0) place = "/";
			else place = place.substring(0, i);
		}
		else {
			place += path.toString();
		}
		load();
	}

	function deleteFile(path) {
		var request = new XMLHttpRequest();
		request.open("DELETE", place + path);
		request.onload = load;
		request.send(place + path);
	}

	function deletePath(path) {
		if (path == "/") return;
		var request = new XMLHttpRequest();
		request.open("DELETE", place);
		request.onload = function () { cd("../"); };
		request.send(place);
	}

	function spaceUpdate(spaces) {
		var free = spaces[0];
		var totol = spaces[1];

		spaceElement.innerHTML = "剩余空间(KiB)/总空间(KiB):";
		spaceElement.innerHTML += (free / 1000).toString() + '/' + (totol / 1000).toString();
		spaceElement.innerHTML += "(" + (free * 100 / totol).toString() + "%)";
	}

	function getSpace() {
		var request = new XMLHttpRequest();
		request.open("POST", "/api/getSpace");
		request.onload = function () { spaceUpdate(this.responseText.split(',')); };
		request.send("");
	}

	function update(files) {

		if (files[0] == "" && place != "/") {
			explorer.innerHTML = ("<button onclick=\'cd(\"../\")\'>" + place.toString() + "</button> <button onclick='deletePath(\"" + place.toString() + "\")'>删除文件夹</button>");
			return;
		}
		explorer.innerHTML = "<button onclick='cd(\"../\")'>" + place.toString() + "</button><br/>";

		let file = "";
		for (i = 0; i < files.length; i++) {
			if (files[i][files[i].length - 1] == '/') {
				file = "<button onclick='cd(\"" + files[i].toString() + "\")'>"
					+ files[i].toString() + "</button> <br/>";
			}
			else {
				file = "<button onclick='window.open(\"/file" + place + files[i].toString() + "\".replace(/%/g, \"%25\"))'>"
					+ files[i].toString() + "</button> ";
				file += "<button onclick='deleteFile(\"" + files[i].toString() + "\")'>删除</button> <br/>";
			}
			explorer.innerHTML += file;
		}
	}

	function load() {
		explorer.innerHTML = "正在读取\"" + place.toString() + "\"中的文件";
		var request = new XMLHttpRequest();
		request.open("POST", "/api/floor");
		request.onload = function () { update(this.responseText.split(splitChar)); };
		request.send(place);
		getSpace();
	}

	function fmtMB(bytes) {
		if (bytes < 1048576) return (bytes / 1024).toFixed(0) + " KB";
		return (bytes / 1048576).toFixed(1) + " MB";
	}

	function upload(path, file) {
		var request = new XMLHttpRequest();
		request.open("PUT", path.replace(/%/g, "%25"));
		uploadButton.disabled = true;
		uploadProgressElement.style.display = "block";
		uploadProgressElement.value = 0;
		uploadStatusElement.textContent = "正在上传 " + file.name + "...";

		// 浏览器原生上传进度事件（已发出字节/总字节）；后端 httpPut 流式写入天然配合
		request.upload.onprogress = function (e) {
			if (e.lengthComputable) {
				uploadProgressElement.value = (e.loaded / e.total) * 100;
				uploadStatusElement.textContent = "正在上传 " + fmtMB(e.loaded) + " / " + fmtMB(e.total);
			}
		};

		request.onload = function () {
			uploadButton.disabled = false;
			if (request.status === 200) {
				uploadProgressElement.value = 100;
				uploadStatusElement.textContent = "✅ 上传完成：" + file.name;
				load();
			} else {
				uploadProgressElement.style.display = "none";
				uploadStatusElement.textContent = "❌ 上传失败：" + (request.responseText || "未知错误");
			}
		};

		request.onerror = function () {
			uploadButton.disabled = false;
			uploadProgressElement.style.display = "none";
			uploadStatusElement.textContent = "❌ 上传失败：网络错误";
		};

		// 直接发送 File 对象：浏览器自动设 Content-Length 并流式读取文件（不再整读进内存）
		request.send(file);
	}

	function uploadPressed() {
		let file = fileUploadElement.files[0];
		if (!file) return;
		// ⚠ 路径必须拼接文件名：place 是当前目录（以 / 结尾），漏拼会把文件内容
		//   PUT 到目录 URL（服务端建目录分支 → body 残留污染下一请求）
		upload(place + file.name, file);
	}

	function newFloor() {
		let path = newFloorElement.value.toString();
		if (path.includes("/")) {
			console.log("path: \"" + path + "\" is invalid");
			return;
		}
		var request = new XMLHttpRequest();
		request.open("PUT", place.toString() + path + "/");
		request.onload = load;
		request.send("");
	}

	document.getElementById("fileUploadButton").addEventListener("click", uploadPressed);
	document.getElementById("newFloorButton").addEventListener("click", newFloor);
	document.getElementById("refresh").addEventListener("click", load);
	load();
	console.log("\"file.js\" loaded");
</script>

<style>
	a:link {
		text-decoration: none;
	}

	a:visited {
		text-decoration: none;
	}

	a:hover {
		text-decoration: underline;
	}

	a:active {
		text-decoration: underline;
	}

	body {
		background-color: #c2dadf;
	}
</style>

</html>
